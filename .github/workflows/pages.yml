# Construit l'application à chaque modification et la publie sur la branche gh-pages (GitHub Pages)
name: Publier l'application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire l'application
        run: |
          pip install pillow
          python3 tools/build.py source/neon-bastion.html "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" dist
          python3 tools/icons.py dist/icons
      - name: Publier sur gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
